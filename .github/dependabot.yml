version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current. The version
  # comment after each pinned SHA is updated along with it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Produces "ci(deps): ..." titles, which pass the PR title check.
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
  # npm: security updates only. A limit of 0 turns off routine version bumps;
  # Dependabot security PRs still read this entry for their commit message.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      # Produces "build(deps): ..." / "build(deps-dev): ..." titles.
      prefix: build
      include: scope
