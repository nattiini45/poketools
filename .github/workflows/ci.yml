concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Without a timeout a hung step holds a runner for GitHub's six-hour default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        # Blocking gate on what ships. Dev tooling is reported by the next step.

      - name: Security audit (all dependencies, report only)
        continue-on-error: true
        run: npm audit --audit-level=high
        # Non-blocking since 2026-10-06: braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm)
        # has no patched release and reaches dev tooling only (Tailwind 3,
        # @next/eslint-plugin-next, @gltf-transform/cli) at their latest versions.

      - name: Lint
        run: npm run lint

      - name: Safe error response guard (enforce)
        run: ENFORCE=1 node scripts/check-safe-error-response.mjs
        # Enforce: fails CI when any route-handler catch block returns a
        # response without routing through safeErrorResponse. Wave 1.2 cleared
        # all offenders; intentional non-returning swallows are exempt.

      - name: Double-encoding (mojibake) guard (enforce)
        run: ENFORCE=1 node scripts/check-mojibake.mjs
        # Enforce: fails CI when any tracked text file (*.md/*.ts/*.tsx/*.js/
        # *.jsx/*.mjs/*.cjs/*.json/*.sql/*.html/*.css) contains a double-encoding
        # artifact (UTF-8 mistakenly decoded as cp1252 and re-saved). Prevents
        # recurrence of the 2026-07-08 docs corruption. Legitimate occurrences
        # can be exempted with a `mojibake-allow` marker.

      - name: i18n hard-coded string check (enforce)
        run: ENFORCE=1 node scripts/check-i18n-strings.mjs --all
        # Enforce: fails CI on any user-facing literal that bypasses src/i18n
        # or any locale hazard (docs/i18n.md). Flipped from report-only by the
        # i18n sweep (i18n-core §12.2 #2); keep in step with the 5b-i18n-strings
        # STEPS entry in scripts/verify-ci.mjs.

      - name: Design guardrails (enforce)
        run: npm run design:guards
        # Enforce: fails CI when non-frozen UI code uses a type size below 11 px,
        # uppercase or tracking, a Tailwind palette colour or a raw <select>
        # (docs/design.md, "Guardrails"). Keep in step with the 5b-design-guards
        # STEPS entry in scripts/verify-ci.mjs.

      - name: Type-check (example format pack)
        run: npm run typecheck:example
        # tsc against the pack this job builds (tsconfig.example.json pins @format-pack to the
        # example pack), so the result does not depend on whether a private pack is on disk.

      - name: Build
        run: npm run build
        env:
          # CI builds and tests the public example pack (docs/format-packs.md); pinned so a
          # private pack can never be picked up here. Keep in step with BUILD_ENV in scripts/verify-ci.mjs.
          FORMAT_PACK: example
          # The type check needs ~2.5 GB since the i18n catalogs landed; the runner's
          # default Node heap (~2 GB) ran out. Keep in step with BUILD_ENV in scripts/verify-ci.mjs.
          NODE_OPTIONS: --max-old-space-size=4096
          # The explicit type-check step above is the type gate; next.config.mjs skips the build's duplicate
          # only for this variable (never for CI, which Vercel sets too). Keep in step with BUILD_ENV in scripts/verify-ci.mjs.
          CI_SKIP_BUILD_TYPECHECK: '1'
          # Build needs these but won't actually connect
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Tests and coverage
        run: npm run test:coverage
        # The only Vitest run: every project, plus the coverage floors in vitest.config.ts.

  # ADVISORY: not a required check and never added to the main-protection ruleset. It starts an ephemeral
  # Supabase stack on the runner (loopback only, no hosted project, no secrets), replays every migration on an
  # empty database, checks src/types/database.ts against the replayed schema and runs the local-stack suites.
  # LOCAL_STACK_CI=1 is what lets those suites run on CI (src/test/local-stack.ts).
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A red job here is information, not a gate: the workflow run stays green.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start the local Supabase stack
        # postgres-meta stays: `supabase gen types --local` (db:types:check) reads the schema through it. Mailpit stays
        # for the e2e job's sign-up mail; this job does not use it.
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Replay every migration on an empty database
        run: npx supabase db reset --local

      - name: Generated types match the replayed schema
        run: npm run db:types:check

      - name: Export the local stack's URL and keys
        run: |
          npx supabase status -o env | while IFS='=' read -r key value; do
            value="${value%\"}"
            value="${value#\"}"
            case "$key" in
              API_URL) name=NEXT_PUBLIC_SUPABASE_URL ;;
              ANON_KEY) name=NEXT_PUBLIC_SUPABASE_ANON_KEY ;;
              SERVICE_ROLE_KEY) name=SUPABASE_SERVICE_ROLE_KEY ;;
              *) continue ;;
            esac
            [ "$name" = NEXT_PUBLIC_SUPABASE_URL ] || echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Local-stack suites
        run: npm run test:db
        env:
          LOCAL_STACK_CI: '1'

  # ADVISORY: not a required check and never added to the main-protection ruleset. It starts its own ephemeral
  # Supabase stack on the runner (loopback only, no hosted project, no secrets), builds the app against it and runs
  # the Playwright smoke suite in Chromium (CONTRIBUTING.md, "End-to-end tests"). A failure uploads the HTML report
  # and the traces.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A red job here is information, not a gate: the workflow run stays green.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start the local Supabase stack
        # Mailpit stays: the sign-up test reads its confirmation mail from it.
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Replay every migration on an empty database
        run: npx supabase db reset --local

      - name: Production build against the local stack
        # `.claude/local-db.cjs` derives the local URL and keys; the build bakes the local asset mirrors.
        run: npm run build:e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke suite
        run: npm run test:e2e
        env:
          LOCAL_STACK_CI: '1'

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ADVISORY: not a required check and never added to the main-protection ruleset. The visual-capture harness
  # (docs/visual-harness.md): its own ephemeral Supabase stack on the runner (loopback only, no hosted project, no
  # secrets, no Storage), the deterministic visual seed, then frozen-surface captures of the PR's base and head and a
  # pixel diff. A frozen surface that changed fails this job; the report and the changed images are uploaded.
  visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A red job here is information, not a gate: the workflow run stays green.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Start the local Supabase stack
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Replay every migration on an empty database
        run: npx supabase db reset --local

      - name: Deterministic visual seed
        run: node scripts/visual/seed.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Frozen surfaces, base vs head
        run: node scripts/visual/compare.mjs --base "origin/${{ github.base_ref }}" --head HEAD --concurrency 2
        env:
          LOCAL_STACK_CI: '1'

      - name: Upload the visual report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: .visual/diff-*/
          retention-days: 7

