concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Without a timeout a hung step holds a runner for GitHub's six-hour default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        # Blocking gate on what ships. Dev tooling is reported by the next step.

      - name: Security audit (all dependencies, report only)
        continue-on-error: true
        run: npm audit --audit-level=high
        # Non-blocking since 2026-10-06: braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm)
        # has no patched release and reaches dev tooling only (Tailwind 3,
        # @next/eslint-plugin-next, @gltf-transform/cli) at their latest versions.

      - name: Lint
        run: npm run lint

      - name: Safe error response guard (enforce)
        run: ENFORCE=1 node scripts/check-safe-error-response.mjs
        # Enforce: fails CI when any route-handler catch block returns a
        # response without routing through safeErrorResponse. Wave 1.2 cleared
        # all offenders; intentional non-returning swallows are exempt.

      - name: Double-encoding (mojibake) guard (enforce)
        run: ENFORCE=1 node scripts/check-mojibake.mjs
        # Enforce: fails CI when any tracked text file (*.md/*.ts/*.tsx/*.js/
        # *.jsx/*.mjs/*.cjs/*.json/*.sql/*.html/*.css) contains a double-encoding
        # artifact (UTF-8 mistakenly decoded as cp1252 and re-saved). Prevents
        # recurrence of the 2026-07-08 docs corruption. Legitimate occurrences
        # can be exempted with a `mojibake-allow` marker.

      - name: i18n hard-coded string check (enforce)
        run: ENFORCE=1 node scripts/check-i18n-strings.mjs --all
        # Enforce: fails CI on any user-facing literal that bypasses src/i18n
        # or any locale hazard (docs/i18n.md). Flipped from report-only by the
        # i18n sweep (i18n-core §12.2 #2); keep in step with the 5b-i18n-strings
        # STEPS entry in scripts/verify-ci.mjs.

      - name: Design guardrails (enforce)
        run: npm run design:guards
        # Enforce: fails CI when non-frozen UI code uses a type size below 11 px,
        # uppercase or tracking, a Tailwind palette colour or a raw <select>
        # (docs/design.md, "Guardrails"). Keep in step with the 5b-design-guards
        # STEPS entry in scripts/verify-ci.mjs.

      - name: Type-check (example format pack)
        run: npm run typecheck:example
        # tsc against the pack this job builds (tsconfig.example.json pins @format-pack to the
        # example pack), so the result does not depend on whether a private pack is on disk.

      - name: Build
        run: npm run build
        env:
          # CI builds and tests the public example pack (docs/format-packs.md); pinned so a
          # private pack can never be picked up here. Keep in step with BUILD_ENV in scripts/verify-ci.mjs.
          FORMAT_PACK: example
          # The type check needs ~2.5 GB since the i18n catalogs landed; the runner's
          # default Node heap (~2 GB) ran out. Keep in step with BUILD_ENV in scripts/verify-ci.mjs.
          NODE_OPTIONS: --max-old-space-size=4096
          # The explicit type-check step above is the type gate; next.config.mjs skips the build's duplicate
          # only for this variable (never for CI, which Vercel sets too). Keep in step with BUILD_ENV in scripts/verify-ci.mjs.
          CI_SKIP_BUILD_TYPECHECK: '1'
          # Build needs these but won't actually connect
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Tests and coverage
        run: npm run test:coverage
        # The only Vitest run: every project, plus the coverage floors in vitest.config.ts.

  # ADVISORY: not a required check and never added to the main-protection ruleset. It starts an ephemeral
  # Supabase stack on the runner (loopback only, no hosted project, no secrets), replays every migration on an
  # empty database, checks src/types/database.ts against the replayed schema and runs the local-stack suites.
  # LOCAL_STACK_CI=1 is what lets those suites run on CI (src/test/local-stack.ts).
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A red job here is information, not a gate: the workflow run stays green.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Reserve the stack's host ports
        # Supabase publishes the stack on fixed host ports (54321-54327), and those sit inside the kernel's
        # ephemeral source-port range (32768-60999). An outbound connection (`npm ci`, an image pull) can take
        # 54322 (Postgres) or 54324 (Mailpit) as its source port, and Docker's host bind then fails with
        # "address already in use" before any test runs. A reserved port is skipped for automatic source-port
        # assignment and stays explicitly bindable, so the stack keeps its documented ports.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - name: Start the local Supabase stack
        # postgres-meta stays: `supabase gen types --local` (db:types:check) reads the schema through it. Mailpit stays
        # for the e2e job's sign-up mail; this job does not use it.
        run: |
          # Bounded retry. The reservation above is preventive: a socket that took one of these ports
          # before it ran keeps it until it closes, and no container cleanup can free it. Clearing the
          # stack and waiting lets that connection go; the next step resets the database anyway.
          for attempt in 1 2 3; do
            if npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "::warning::supabase start failed on attempt ${attempt}; sockets on the stack's ports:"
            sudo ss -tanp | grep -E ':5432[0-9]' || true
            npx supabase stop --no-backup || true
            sleep 10
          done
          exit 1

      - name: Replay every migration on an empty database
        id: schema-replay
        run: npx supabase db reset --local

      - name: Generated types match the replayed schema
        id: schema-types
        run: npm run db:types:check

      - name: Capture regenerated schema types on drift
        if: failure() && steps.schema-types.outcome == 'failure'
        run: npm run db:types

      - name: Upload regenerated schema types
        if: failure() && steps.schema-types.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: generated-schema-types
          path: src/types/database.ts
          if-no-files-found: error
          retention-days: 3

      - name: Phase storage foundation rehearsal
        if: always() && steps.schema-replay.outcome == 'success'
        run: |
          { printf 'BEGIN;\n'; cat scripts/league-trash-lab/seed.sql scripts/phase-separation/p1-rehearsal.sql; } |
            docker exec -i supabase_db_poketools psql -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Export the local stack's URL and keys
        run: |
          npx supabase status -o env | while IFS='=' read -r key value; do
            value="${value%\"}"
            value="${value#\"}"
            case "$key" in
              API_URL) name=NEXT_PUBLIC_SUPABASE_URL ;;
              ANON_KEY) name=NEXT_PUBLIC_SUPABASE_ANON_KEY ;;
              SERVICE_ROLE_KEY) name=SUPABASE_SERVICE_ROLE_KEY ;;
              *) continue ;;
            esac
            [ "$name" = NEXT_PUBLIC_SUPABASE_URL ] || echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Local-stack suites
        run: |
          LOCAL_STACK_FORMAT_TEST_PASS=legacy npm run test:db
          bash scripts/phase-separation/legacy-format-fence.sh supabase_db_poketools
          LOCAL_STACK_FORMAT_TEST_PASS=frozen_legacy npm run test:db
          docker exec -i supabase_db_poketools psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT public.phase_storage_transition('frozen_legacy', 'frozen_phase');
          SELECT public.phase_storage_transition('frozen_phase', 'phase');
          SQL
          LOCAL_STACK_FORMAT_TEST_PASS=phase npm run test:db
        env:
          LOCAL_STACK_CI: '1'

      - name: P6 preflight report
        # Runs the read-only cutover preflight against a seeded database and asserts its contract, so an edit
        # that breaks the script fails here instead of during the owner's production run. It is the last step
        # because it commits the lab seed; the suites above need a clean database and must not see it.
        #
        # Only the full-bundle state is asserted. The pre-bundle state (a replay stopped at 20261115120000,
        # where the native blocks print `skipped: needs <file>` rows) needs a second stack and is covered by
        # the rehearsal that produced the script, not by CI.
        run: |
          set -euo pipefail
          out="$(mktemp)"
          # The seed is committed here on purpose: the rehearsal above rolls its copy back, and the preflight
          # is only meaningful against rows. Every statement in the preflight itself is a SELECT inside one
          # BEGIN READ ONLY transaction.
          {
            printf 'BEGIN;\n'
            cat scripts/league-trash-lab/seed.sql
            echo "SELECT lt_lab.seed(8, 4, 'P6 preflight fixture');"
            printf 'COMMIT;\n'
          } | docker exec -i supabase_db_poketools psql -U postgres -d postgres -v ON_ERROR_STOP=1
          leagues="$(docker exec -i supabase_db_poketools psql -U postgres -d postgres -tAc 'SELECT count(*) FROM public.seasons' | tr -d '[:space:]')"
          test "${leagues:-0}" -ge 1
          docker exec -i supabase_db_poketools psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - \
            < scripts/phase-separation/p6-preflight.sql | tee "$out"
          grep -q '### phase schema (bundle) applied: true' "$out"
          if grep -q 'needs 2026' "$out"; then
            echo '::error::the preflight reported a block it could not run on a full bundle'
            exit 1
          fi
          for block in '[1] Ownership families' '[2] Trash generation' '[3] Applied migration' \
                       '[4] Foreign keys into the moved graph' '[5] INSERT/DELETE triggers' \
                       '[6] Null and cross-owner' '[7] Aggregate queues' '[8] Replay-hash' \
                       '[9] Group slots' '[10] Storage generation' '[11] JSON-embedded'; do
            grep -qF "=== $block" "$out" || { echo "::error::missing preflight block: $block"; exit 1; }
          done
          grep -q '1.ownership-total' "$out"
          test "$(grep -c '^11\.json-refs|' "$out")" -ge 30

  # ADVISORY: not a required check and never added to the main-protection ruleset. It starts its own ephemeral
  # Supabase stack on the runner (loopback only, no hosted project, no secrets), builds the app against it and runs
  # the Playwright smoke suite in Chromium (CONTRIBUTING.md, "End-to-end tests"). A failure uploads the HTML report
  # and the traces.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A red job here is information, not a gate: the workflow run stays green.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Reserve the stack's host ports
        # Supabase publishes the stack on fixed host ports (54321-54327), and those sit inside the kernel's
        # ephemeral source-port range (32768-60999). An outbound connection (`npm ci`, an image pull) can take
        # 54322 (Postgres) or 54324 (Mailpit) as its source port, and Docker's host bind then fails with
        # "address already in use" before any test runs. A reserved port is skipped for automatic source-port
        # assignment and stays explicitly bindable, so the stack keeps its documented ports.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - name: Start the local Supabase stack
        # Mailpit stays: the sign-up test reads its confirmation mail from it.
        run: |
          # Bounded retry. The reservation above is preventive: a socket that took one of these ports
          # before it ran keeps it until it closes, and no container cleanup can free it. Clearing the
          # stack and waiting lets that connection go; the next step resets the database anyway.
          for attempt in 1 2 3; do
            if npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "::warning::supabase start failed on attempt ${attempt}; sockets on the stack's ports:"
            sudo ss -tanp | grep -E ':5432[0-9]' || true
            npx supabase stop --no-backup || true
            sleep 10
          done
          exit 1

      - name: Replay every migration on an empty database
        run: npx supabase db reset --local

      - name: Production build against the local stack
        # `.claude/local-db.cjs` derives the local URL and keys; the build bakes the local asset mirrors.
        run: npm run build:e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke suite
        run: npm run test:e2e
        env:
          LOCAL_STACK_CI: '1'

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ADVISORY: not a required check and never added to the main-protection ruleset. The visual-capture harness
  # (docs/visual-harness.md): its own ephemeral Supabase stack on the runner (loopback only, no hosted project, no
  # secrets, no Storage), the deterministic visual seed, then frozen-surface captures of the PR's base and head and a
  # pixel diff. A frozen surface that changed fails this job; the report and the changed images are uploaded.
  visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A red job here is information, not a gate: the workflow run stays green.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Reserve the stack's host ports
        # Supabase publishes the stack on fixed host ports (54321-54327), and those sit inside the kernel's
        # ephemeral source-port range (32768-60999). An outbound connection (`npm ci`, an image pull) can take
        # 54322 (Postgres) or 54324 (Mailpit) as its source port, and Docker's host bind then fails with
        # "address already in use" before any test runs. A reserved port is skipped for automatic source-port
        # assignment and stays explicitly bindable, so the stack keeps its documented ports.
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329

      - name: Start the local Supabase stack
        run: |
          # Bounded retry. The reservation above is preventive: a socket that took one of these ports
          # before it ran keeps it until it closes, and no container cleanup can free it. Clearing the
          # stack and waiting lets that connection go; the next step resets the database anyway.
          for attempt in 1 2 3; do
            if npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            echo "::warning::supabase start failed on attempt ${attempt}; sockets on the stack's ports:"
            sudo ss -tanp | grep -E ':5432[0-9]' || true
            npx supabase stop --no-backup || true
            sleep 10
          done
          exit 1

      - name: Replay every migration on an empty database
        run: npx supabase db reset --local

      - name: Deterministic visual seed
        run: node scripts/visual/seed.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Frozen surfaces, base vs head
        run: node scripts/visual/compare.mjs --base "origin/${{ github.base_ref }}" --head HEAD --concurrency 2
        env:
          LOCAL_STACK_CI: '1'

      - name: Upload the visual report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: .visual/diff-*/
          # The report lives under `.visual`, and upload-artifact skips hidden files unless told otherwise
          # (`excludeHiddenFiles` in its file search), so without this the glob matches nothing and every
          # failed run uploads an empty artifact. Verified against a generated .visual/diff-* tree.
          include-hidden-files: true
          retention-days: 7
